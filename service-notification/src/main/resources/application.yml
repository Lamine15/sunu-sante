server:
  port: 8084
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: service-notification
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:sunu}
    password: ${RABBITMQ_PASSWORD:sunu-demo}
    connection-timeout: 2s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [notification] %logger{0} : %msg%n"
